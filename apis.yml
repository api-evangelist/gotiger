aid: gotiger
name: Gotiger
description: >-
  GoTiger is a Berlin-based food company that operates multiple delivery-first food brands out of
  modern ghost kitchens, including Bok Bok Chicken, GoDumpling and Kyoo Chicken. Founded in 2022,
  the company began as GoTiger Asia Grocery Delivery, a same-day app-based service delivering Japanese,
  Korean and Chinese groceries and everyday essentials across Berlin and Potsdam on a Shopify Plus
  backend, before pivoting to a portfolio of virtual restaurant brands. GoTiger is a consumer product
  company backed by Speedinvest, Adjacent, Nucleus Capital and Shio Capital; it does not publish a
  public developer API, developer portal, or machine-readable API artifacts at this time.
